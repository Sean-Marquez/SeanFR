<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Dear Candle PH</title>
    <link rel="stylesheet" href="Login,Register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">
            <h2>🕯 Dear Candle PH</h2>
            <span>PHILIPPINE HANDCRAFTED CANDLES</span>
        </div>

        <nav>
            <a href="Landing.html">Hero</a>

    </header>

    <main class="auth-section">
        <div class="auth-card">
            <p class="section-label">JOIN OUR COMMUNITY</p>
            <h1>Create an Account</h1>
            <p class="auth-description">Join Dear Candle PH and find your favorite scents.</p>

            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>

                <button type="submit">Create Account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="LogIn.html">Login here</a></p>
        </div>
    </main>

    <footer>
        <p>© 2026 Dear Candle PH | Handcrafted with care in the Philippines.</p>
    </footer>

</body>
